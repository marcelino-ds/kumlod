# /etc/systemd/system/litestream.service.d/override.conf
# Run Litestream as the kumlod user so files next to the database keep the right owner.
[Service]
User=kumlod
Group=kumlod
EnvironmentFile=/etc/kumlod/storage.env
ExecStart=
ExecStart=/usr/bin/litestream replicate -config /etc/litestream.yml
Restart=always
RestartSec=5
