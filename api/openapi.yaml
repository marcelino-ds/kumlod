openapi: 3.0.3
info:
  title: Kumlod API
  version: 0.1.0
  description: |
    Kontrak API Kumlod Fase 1. File ini sumber kebenaran untuk backend Go (oapi-codegen)
    dan frontend React (openapi-typescript).

    Konvensi:
    - Semua path di bawah `/api`, field JSON memakai snake_case.
    - Semua endpoint butuh cookie sesi `kumlod_session`, kecuali `getHealth` dan `login`.
    - Request POST, PUT, dan DELETE wajib membawa header `X-Requested-With: kumlod`.
    - ID berupa string UUID. Endpoint create menerima `id` opsional (UUIDv7 dari klien).
    - `LocalDate` = `YYYY-MM-DD` dan `LocalTime` = `HH:MM` dalam zona waktu aplikasi.
      Timestamp memakai RFC 3339.
    - Update memakai PUT dengan objek lengkap. Field nullable dikirim `null` untuk mengosongkan.
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: system
  - name: auth
  - name: settings
  - name: dashboard
  - name: semesters
  - name: courses
  - name: meetings
  - name: grades
  - name: tasks
  - name: materials
  - name: push

paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Status server
      security: []
      responses:
        '200':
          description: Server sehat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login dan buat sesi
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil, cookie `kumlod_session` diset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Hapus sesi saat ini
      responses:
        '204':
          description: Logout berhasil
        default:
          $ref: '#/components/responses/Error'

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Pengguna yang sedang login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'

  /api/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Ganti password dan cabut sesi lain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password diganti
        default:
          $ref: '#/components/responses/Error'

  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [settings]
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Pengaturan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'

  /api/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Ringkasan hari ini untuk semester aktif
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        default:
          $ref: '#/components/responses/Error'

  /api/semesters:
    get:
      tags: [semesters]
      operationId: listSemesters
      responses:
        '200':
          description: Semua semester, urut tanggal mulai menurun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [semesters]
      operationId: createSemester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterCreate'
      responses:
        '201':
          description: Semester dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        default:
          $ref: '#/components/responses/Error'

  /api/semesters/{semesterId}:
    parameters:
      - $ref: '#/components/parameters/SemesterId'
    get:
      tags: [semesters]
      operationId: getSemester
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [semesters]
      operationId: updateSemester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterUpdate'
      responses:
        '200':
          description: Semester diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [semesters]
      operationId: deleteSemester
      summary: Hapus semester beserta seluruh isinya
      responses:
        '204':
          description: Terhapus
        default:
          $ref: '#/components/responses/Error'

  /api/semesters/{semesterId}/activate:
    parameters:
      - $ref: '#/components/parameters/SemesterId'
    post:
      tags: [semesters]
      operationId: activateSemester
      responses:
        '200':
          description: Semester jadi aktif, semester lain nonaktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        default:
          $ref: '#/components/responses/Error'

  /api/semesters/{semesterId}/courses:
    parameters:
      - $ref: '#/components/parameters/SemesterId'
    get:
      tags: [courses]
      operationId: listCourses
      responses:
        '200':
          description: Matkul di semester ini, urut nama
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [courses]
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Matkul dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        default:
          $ref: '#/components/responses/Error'

  /api/courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [courses]
      operationId: getCourse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [courses]
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Matkul diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [courses]
      operationId: deleteCourse
      responses:
        '204':
          description: Terhapus
        default:
          $ref: '#/components/responses/Error'

  /api/courses/{courseId}/meetings:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [meetings]
      operationId: listMeetings
      responses:
        '200':
          description: Pertemuan urut tanggal lalu jam mulai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [meetings]
      operationId: createMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreate'
      responses:
        '201':
          description: Pertemuan ditambahkan dengan nomor berikutnya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        default:
          $ref: '#/components/responses/Error'

  /api/courses/{courseId}/meetings/generate:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [meetings]
      operationId: generateMeetings
      summary: Buat pertemuan dari jadwal. 409 kalau matkul sudah punya pertemuan.
      responses:
        '201':
          description: Pertemuan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingList'
        default:
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    put:
      tags: [meetings]
      operationId: updateMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingUpdate'
      responses:
        '200':
          description: Pertemuan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [meetings]
      operationId: deleteMeeting
      responses:
        '204':
          description: Terhapus
        default:
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}/attendance:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    put:
      tags: [meetings]
      operationId: setAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceUpdate'
      responses:
        '200':
          description: Absen tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        default:
          $ref: '#/components/responses/Error'

  /api/courses/{courseId}/grades:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [grades]
      operationId: getCourseGrades
      responses:
        '200':
          description: Ringkasan nilai matkul
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeSummary'
        default:
          $ref: '#/components/responses/Error'

  /api/courses/{courseId}/grades/components:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    put:
      tags: [grades]
      operationId: replaceGradeComponents
      summary: Ganti seluruh komponen nilai. Komponen dengan `id` lama dipertahankan supaya tautan tugas tidak putus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeComponentsUpdate'
      responses:
        '200':
          description: Komponen tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeSummary'
        default:
          $ref: '#/components/responses/Error'

  /api/gpa:
    get:
      tags: [grades]
      operationId: getGpa
      parameters:
        - name: target_ipk
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 4
      responses:
        '200':
          description: IPS per semester, IPK, dan simulasi kalau `target_ipk` diisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpaSummary'
        default:
          $ref: '#/components/responses/Error'

  /api/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
        - name: semester_id
          in: query
          required: false
          description: Default semester aktif. Isi `all` untuk semua semester.
          schema:
            type: string
        - name: course_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
        - name: due_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Tugas urut deadline menaik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [tasks]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Tugas dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'

  /api/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [tasks]
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Tugas diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [tasks]
      operationId: deleteTask
      responses:
        '204':
          description: Terhapus
        default:
          $ref: '#/components/responses/Error'

  /api/tasks/{taskId}/status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [tasks]
      operationId: setTaskStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdate'
      responses:
        '200':
          description: Status diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'

  /api/materials:
    get:
      tags: [materials]
      operationId: listMaterials
      parameters:
        - name: semester_id
          in: query
          required: false
          description: Default semester aktif. Isi `all` untuk semua semester.
          schema:
            type: string
        - name: course_id
          in: query
          required: false
          schema:
            type: string
        - name: meeting_id
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Pencarian teks penuh (pencocokan awalan kata). Hasil diurutkan menurut relevansi.
          schema:
            type: string
      responses:
        '200':
          description: Materi, urut terbaru kalau tanpa `q`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [materials]
      operationId: createMaterial
      summary: Tambah materi berupa link atau catatan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreate'
      responses:
        '201':
          description: Materi dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        default:
          $ref: '#/components/responses/Error'

  /api/materials/upload:
    post:
      tags: [materials]
      operationId: uploadMaterial
      summary: Upload file sebagai materi
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, course_id]
              properties:
                file:
                  type: string
                  format: binary
                course_id:
                  type: string
                meeting_id:
                  type: string
                title:
                  type: string
                  description: Default nama file tanpa ekstensi
                description:
                  type: string
                id:
                  type: string
      responses:
        '201':
          description: File tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        default:
          $ref: '#/components/responses/Error'

  /api/materials/{materialId}:
    parameters:
      - $ref: '#/components/parameters/MaterialId'
    get:
      tags: [materials]
      operationId: getMaterial
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [materials]
      operationId: updateMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialUpdate'
      responses:
        '200':
          description: Materi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [materials]
      operationId: deleteMaterial
      responses:
        '204':
          description: Terhapus, file fisik ikut dihapus
        default:
          $ref: '#/components/responses/Error'

  /api/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [materials]
      operationId: downloadFile
      parameters:
        - name: download
          in: query
          required: false
          description: 'Paksa header Content-Disposition attachment'
          schema:
            type: boolean
      responses:
        '200':
          description: Isi file. Mendukung header Range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /api/push/public-key:
    get:
      tags: [push]
      operationId: getPushPublicKey
      responses:
        '200':
          description: VAPID public key (base64url)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushPublicKey'
        default:
          $ref: '#/components/responses/Error'

  /api/push/subscriptions:
    post:
      tags: [push]
      operationId: subscribePush
      summary: Simpan subscription perangkat. Endpoint yang sama diperbarui.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '204':
          description: Tersimpan
        default:
          $ref: '#/components/responses/Error'

  /api/push/unsubscribe:
    post:
      tags: [push]
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushUnsubscribeInput'
      responses:
        '204':
          description: Subscription dihapus (tetap 204 kalau tidak ditemukan)
        default:
          $ref: '#/components/responses/Error'

  /api/push/test:
    post:
      tags: [push]
      operationId: sendTestPush
      responses:
        '200':
          description: Hasil pengiriman ke semua perangkat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTestResult'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kumlod_session

  parameters:
    SemesterId:
      name: semesterId
      in: path
      required: true
      schema:
        type: string
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LocalDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: '2026-09-01'
    LocalTime:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: '08:00'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_error, unauthenticated, csrf_failed, not_found, conflict, file_too_large, rate_limited, internal]
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 256

    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string

    Me:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    GradeScaleEntry:
      type: object
      required: [letter, min_score, points]
      properties:
        letter:
          type: string
          minLength: 1
          maxLength: 3
        min_score:
          type: number
          format: double
          minimum: 0
          maximum: 100
        points:
          type: number
          format: double
          minimum: 0
          maximum: 4

    ReminderSettings:
      type: object
      required: [task_enabled, attendance_enabled, digest_enabled, digest_time]
      properties:
        task_enabled:
          type: boolean
        attendance_enabled:
          type: boolean
        digest_enabled:
          type: boolean
        digest_time:
          $ref: '#/components/schemas/LocalTime'

    Baseline:
      type: object
      required: [gpa, credits]
      properties:
        gpa:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 4
          description: IPK sebelum memakai Kumlod
        credits:
          type: integer
          minimum: 0
          maximum: 300
          description: Total SKS lulus sebelum memakai Kumlod

    SettingsUpdate:
      type: object
      required: [timezone, grade_scale, count_excused_as_absent, default_min_attendance_pct, default_total_meetings, reminders, baseline]
      properties:
        timezone:
          type: string
          example: Asia/Jakarta
        grade_scale:
          type: array
          minItems: 1
          maxItems: 20
          description: Diurutkan server berdasarkan `min_score` menurun
